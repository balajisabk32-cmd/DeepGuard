schema_version: "2.0"
decision:
  authentic_max_p: 0.35
  manipulated_min_p: 0.65
  # NOTE: evidence_weight is capped at 0.5 when only one modality is usable
  # (e.g. silent video). Raising this above 0.5 breaks every silent clip. See plan §3.5.
  min_evidence_weight: 0.30
rppg:
  band_hz: [0.7, 4.0]
  min_window_sec: 12.0
  quality_snr_floor_db: -3.0
  quality_snr_ceil_db: 9.0
  hr_spread_norm_bpm: 12.0
  # Evidence-graded contribution (replaces the old hard cutoff).
  #   quality <= min_quality_for_evidence  -> full abstention, score forced 0.5
  #   quality >= quality_trust_full        -> score used at face value
  #   in between                           -> shrunk toward 0.5 proportionally
  # A hard cutoff made rPPG contribute NOTHING on real compressed footage, which
  # is almost all footage. Shrinkage keeps it in the verdict at honest strength.
  min_quality_for_evidence: 0.05
  quality_trust_full: 0.35
  min_quality_for_scoring: 0.30   # retained: consumers still read this as "trusted"
  weights: {corr: 0.40, spread: 0.35, phase: 0.25}
  # PPG spatial-temporal map (FakeCatcher / DeepRhythm style, classical).
  # Reference points from Kammari et al. 2024 §3: authentic faces hold pairwise
  # r > 0.70 and HR spread < 12 BPM across regions.
  map:
    enabled: true
    grid: [6, 5]                # 30 patches -> up to 435 pairwise comparisons
    # Minimum skin-pixel fraction for a patch to count, per frame.
    # Lives here because BOTH the offline detector (ppgmap.build_stmap) and the
    # live viewer (webcam_heatmap) must agree. They previously hardcoded 0.35 and
    # 0.30 independently, so the heatmap rendered patches green that analyze()
    # was silently discarding — the picture disagreed with the verdict.
    min_skin_fraction: 0.35
    authentic_corr: 0.70
    hr_jump_norm_bpm: 12.0      # paper §3.3 temporal HRV dimension
    weights: {corr: 0.35, spread: 0.25, phase: 0.20, hrv: 0.20}
lipsync:
  envelope_band_hz: [1.0, 8.0]
  window_sec: 1.0
  hop_sec: 0.5
  max_lag_ms: 300
  min_voiced_windows: 8
  lag_iqr_floor_ms: 40
  lag_iqr_ceil_ms: 160
  weights: {iqr: 0.50, ncc: 0.30, offset: 0.20}
fusion:
  prior_weights: {rppg: 0.5, lipsync: 0.5}
ingest:
  min_duration_sec: 4.0
  max_decode_sec: 300.0
  analyze_first_sec: 20.0
  max_upload_mb: 100
  min_face_detection_rate: 0.6
